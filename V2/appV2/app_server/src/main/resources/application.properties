server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
spring.application.name=spur-ring-server
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.config.import=optional:file:.env[.properties]
siliconflow.api-key=${SILICONFLOW_API_KEY:}
siliconflow.base-url=${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
siliconflow.model=${SILICONFLOW_MODEL:Qwen/Qwen3-8B}
# Optional fallback stays with the same provider/key; no new paid model is selected by default.
siliconflow.fallback-model=${SILICONFLOW_FALLBACK_MODEL:}
siliconflow.attempt-timeout-seconds=30
siliconflow.retry-delay-ms=600
siliconflow.transcription-model=${SILICONFLOW_TRANSCRIPTION_MODEL:FunAudioLLM/SenseVoiceSmall}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# Ignore untrusted proxy headers; behind ALB, quotas may group clients by proxy/node address.
# Global quotas remain enforced. Only enable real client IP after verifying the proxy trust chain.
server.forward-headers-strategy=none
server.max-http-request-header-size=16KB
server.tomcat.max-connections=200
server.tomcat.threads.max=32
server.tomcat.accept-count=50
server.tomcat.connection-timeout=10s
# Disabled until durable storage and authenticated device routes are configured.
spur.agent.enabled=${SPUR_AGENT_ENABLED:false}
spur.agent.worker-enabled=true
spur.agent.jdbc-url=${SPUR_AGENT_JDBC_URL:}
spur.agent.jdbc-user=${SPUR_AGENT_JDBC_USER:}
spur.agent.jdbc-password=${SPUR_AGENT_JDBC_PASSWORD:}
