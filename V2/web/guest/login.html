<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spur · 邀请体验</title><style>*{box-sizing:border-box}body{margin:0;background:#fafaf9;color:#242528;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(410px,100%)}.orb{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dce7ff 36%,#92b0ff 72%,#fff);box-shadow:0 0 35px #dbe4ff;margin:0 auto 24px}h1{text-align:center;font-size:32px;letter-spacing:-1px}p{text-align:center;color:#94969c;line-height:1.8}form{margin-top:30px;background:#fff;padding:24px;border:1px solid #eaeaec;border-radius:17px}label{display:block;margin-bottom:10px}input,button{font:inherit;border-radius:10px;width:100%;padding:13px}input{border:1px solid #ddd}button{margin-top:16px;background:#292c32;color:#fff;border:0;cursor:pointer}button:disabled{opacity:.5}#error{color:#a34e4e;font-size:13px;text-align:left}small{display:block;text-align:center;margin-top:22px;color:#94969c;line-height:1.8}</style></head><body><main><div class="orb"></div><h1>Hi, I'm Spur.</h1><p>Every great idea begins with a small intent.</p><form id="login"><label for="code">输入你的专属邀请码</label><input id="code" autocomplete="off" required maxlength="43" spellcheck="false"><button>开始体验 →</button><p id="error" role="status"></p></form><small>每人一个邀请码 · 首次验证后保持约30天登录<br>访客工作空间独立，不连接邀请人的个人账号。</small></main><script src="/login.js"></script></body></html>
