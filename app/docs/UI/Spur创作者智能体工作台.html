const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page='chat',messages=[],tasks=[],files=[],ideas=[{text:'城市漫游开头先拍清晨的街道，再说为什么重新认识这座城。',time:'今天 08:35',project:'城市漫游'}],version=1;let script='城市漫游 · 第一期\n\n开场：清晨街道的环境镜头。\n\n口播：每天经过的地方，也许藏着我们没有认真看过的生活。今天，我想沿着这条街，重新认识这座城市。\n\n结构：街道观察 → 一家小店 → 与店主的交流 → 收尾感想。';
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2400)}function closePanel(){$('#overlay').style.display='none'}function panel(html){$('#panel').innerHTML=html;$('#overlay').style.display='flex'}function head(t){return `<div class="row"><h2>${t}</h2><button class="close" onclick="closePanel()">×</button></div>`}function go(p,btn){page=p;document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));if(btn)btn.classList.add('active');$('#side').classList.remove('show');render()}
function newChat(text){messages=[];go('chat');if(text){$('#input').value=text;send()}}function prompt(t){$('#input').value=t;send()}
function render(){const titles={chat:'创作助手',projects:'创作项目',ideas:'录音与灵感',tasks:'任务',files:'文件',settings:'连接与设置'};$('#title').textContent=titles[page];$('#composer').style.display=page==='chat'?'block':'none';$('#count').textContent=tasks.filter(t=>t.status==='running').length||'';let h='';if(page==='chat'){h=messages.length?messages.map(m=>`<div class="message ${m.user?'user':''}">${m.user?esc(m.text):'<div class="who">Spur</div>'+m.text}</div>`).join(''):`<div class="welcome"><div class="badge">你的创作与经营助手</div><h1>今天，我们推进哪件事？</h1><div class="muted">从一条灵感，到脚本、资料和合作。<br>你可以开始新任务，也可以接着之前的项目。</div><div class="chips"><button class="chip" onclick="prompt('整理今天的灵感，更新城市漫游脚本')">继续我的脚本</button><button class="chip" onclick="prompt('帮我起草品牌合作邮件')">处理品牌合作</button><button class="chip" onclick="prompt('制作一份合作方案 PDF')">制作 PDF 方案</button></div><div class="card" style="margin-top:30px"><div class="row"><div><div class="meta">戒指新录音 · 08:35</div><p style="font-size:14px">${esc(ideas[0].text)}</p></div><button class="link" onclick="ideaDetail(0)">查看 ›</button></div></div></div>`}else if(page==='projects'){h=`<div class="pagehead"><h1>创作有上下文，也有进度。</h1><div class="muted">灵感、脚本与合作任务，都回到各自的项目。</div></div><div class="grid"><div class="card"><span class="badge">进行中</span><h3 style="margin-top:18px">城市漫游 · 第一期</h3><p class="muted">${ideas.length} 条灵感 · 脚本 V${version}</p><button class="link" onclick="projectDetail()">打开项目 →</button></div><div class="card"><span class="badge">商务</span><h3 style="margin-top:18px">春季品牌合作</h3><p class="muted">合作简报 · 邮件草稿 · 待确认</p><button class="link" onclick="promptFromPage('帮我起草品牌合作邮件')">继续处理 →</button></div></div>`}else if(page==='ideas'){h='<div class="pagehead"><h1>原话保留，想法归档。</h1><div class="muted">点击录音查看转写、来源和项目归属。</div></div>'+ideas.map((i,n)=>`<div class="card"><div class="row"><span class="meta">${esc(i.time)} · 戒指录入（模拟）</span><span class="badge">${esc(i.project)}</span></div><p>${esc(i.text)}</p><button class="link" onclick="ideaDetail(${n})">查看录音详情 →</button></div>`).join('')}else if(page==='tasks'){h='<div class="pagehead"><h1>每件事，都有下文。</h1><div class="muted">查看执行过程、确认外部操作或取消任务。</div></div>'+(tasks.length?tasks.map((t,n)=>`<div class="card"><div class="row"><h3>${t.name}</h3><span class="badge">${status(t)}</span></div><p class="muted">${t.steps.at(-1)}</p><button class="link" onclick="taskDetail(${n})">查看任务 →</button></div>`).join(''):'<div class="card muted">还没有任务。通过对话开始一件工作。</div>')}else if(page==='files'){h='<div class="pagehead"><h1>成果集中在这里。</h1><div class="muted">查看、编辑和下载。文件保留对应项目来源。</div></div>'+(files.length?files.map((f,n)=>`<div class="card row"><div><h3>${f.name}</h3><span class="meta">${f.kind} · 城市漫游 / 合作项目</span></div><button class="link" onclick="fileDetail(${n})">打开 →</button></div>`).join(''):'<div class="card muted">生成脚本或方案后，会出现在这里。</div>')}else{h='<div class="pagehead"><h1>连接你的工作环境。</h1><div class="muted">此原型中的连接均为展示，不具备真实账户权限。</div></div>'+['Spur 戒指 · 模拟连接','邮箱 · 未连接','日历 · 未连接','创作偏好 · 第一人称、自然叙述'].map(x=>`<div class="card row"><h3>${x}</h3><button class="link" onclick="toast('这是连接入口展示，尚未接入真实服务')">管理 →</button></div>`).join('')}$('#body').innerHTML='<div class="content">'+h+'</div>';if(page==='chat')$('#body').scrollTop=$('#body').scrollHeight}
function status(t){return {running:'进行中',done:'已完成',confirm:'待你确认',cancelled:'已取消'}[t.status]}function promptFromPage(t){go('chat');prompt(t)}function capture(){panel(head('补充一条灵感')+'<p class="muted">模拟戒指输入；不会请求麦克风。</p><textarea id="ideaInput" style="min-height:130px" placeholder="记录你刚刚想到的内容"></textarea><p class="meta">归入项目：城市漫游</p><button class="btn primary" onclick="saveIdea()">保存灵感并继续创作</button>')}function saveIdea(){let t=$('#ideaInput').value.trim();if(!t)return;ideas.unshift({text:t,time:'刚刚',project:'城市漫游'});closePanel();go('chat');messages.push({user:false,text:'已保留这条原话，并归入「城市漫游」。<br><button class="link" onclick="prompt(\'根据新灵感更新城市漫游脚本\')">更新现有脚本 →</button>'});render()}function ideaDetail(n){panel(head('录音与灵感')+`<span class="badge">${esc(ideas[n].project)}</span><p class="meta">${esc(ideas[n].time)} · 原音频未接入</p><div class="card">${esc(ideas[n].text)}</div><p class="muted">标签：选题 / 口播 · 项目归属为演示预设</p><button class="btn primary" onclick="closePanel();promptFromPage('根据新灵感更新城市漫游脚本')">用于脚本修订</button>`)}function projectDetail(){panel(head('城市漫游 · 第一期')+`<p class="muted">${ideas.length} 条灵感 · 脚本 V${version}</p>`+ideas.map(i=>`<div class="card">${esc(i.text)}</div>`).join('')+`<button class="btn primary" onclick="closePanel();promptFromPage('继续城市漫游脚本')">继续对话</button>`)}
function send(){let t=$('#input').value.trim();if(!t)return;$('#input').value='';messages.push({user:true,text:t});let type=/邮件|品牌|合作回复/.test(t)?'mail':/PDF|pdf|方案/.test(t)?'pdf':'script';let task={name:type==='mail'?'起草品牌合作邮件':type==='pdf'?'制作合作方案':'更新城市漫游脚本',status:'running',steps:['已收到任务（演示）'],type};tasks.push(task);let n=tasks.length-1;messages.push({user:false,text:`我会${task.name}，成果和后续修改都保存在当前项目。<div class="card"><div class="row"><b>${task.name}</b><button class="link" onclick="taskDetail(${n})">查看进度 →</button></div><span class="meta">演示任务已启动 · 可切换页面</span></div>`});render();setTimeout(()=>{if(task.status!=='running')return;task.steps.push('已整理项目上下文（模拟）');render();},900);setTimeout(()=>{if(task.status!=='running')return;task.steps.push('已完成草稿（模拟）');task.status=type==='mail'?'confirm':'done';let f={name:type==='mail'?'品牌合作邮件草稿':type==='pdf'?'城市漫游合作方案':`城市漫游脚本 V${++version}`,kind:type==='pdf'?'可打印方案预览':type==='mail'?'邮件草稿':'脚本',text:type==='script'?script+'\n\n新补充：'+ideas[0].text:type==='mail'?'您好，感谢关注我的城市漫游系列。\n\n希望进一步了解此次合作的品牌目标、交付要求、预算与时间安排，以便提供匹配的内容方案。\n\n期待您的回复。':'城市漫游 · 合作方案\n\n内容方向：以城市生活观察连接品牌场景。\n\n交付：一条短视频与配套图文。\n\n拍摄安排、费用及使用授权需与品牌确认。'};files.push(f);task.file=files.length-1;messages.push({user:false,text:`${type==='mail'?'邮件草稿已准备好，确认前不会发送。':'草稿已完成，可以查看并继续修改。'}<div class="card row"><div><h3>${f.name}</h3><span class="meta">${f.kind} · 演示成果</span></div><button class="link" onclick="fileDetail(${task.file})">打开 →</button></div>`});render()},2100)}function taskDetail(n){let t=tasks[n];panel(head(t.name)+`<span class="badge">${status(t)}</span>`+t.steps.map(s=>`<div class="trace"><b>✓</b>${s}</div>`).join('')+(t.file!==undefined?`<button class="btn" onclick="fileDetail(${t.file})">查看成果</button> `:'')+(t.status==='running'?`<button class="btn" onclick="tasks[${n}].status='cancelled';closePanel();render()">取消任务</button>`:'')+(t.status==='confirm'?`<button class="btn primary" onclick="toast('模拟发送完成；没有邮件真正发出');tasks[${n}].status='done';closePanel();render()">确认模拟发送</button>`:''))}function fileDetail(n){let f=files[n];panel(head(f.name)+`<p class="meta">${f.kind} · 可编辑演示稿</p><textarea id="fileText">${esc(f.text)}</textarea><div class="chips"><button class="btn primary" onclick="files[${n}].text=$('#fileText').value;toast('修改已保存在本次演示中')">保存修改</button><button class="btn" onclick="download(${n})">下载文本</button>${f.kind==='可打印方案预览'?'<button class="btn" onclick="printFile('+n+')">打印 / 存为 PDF</button>':''}</div><p class="meta">刷新页面会重置；真实文件生成与版本存储尚未接入。</p>`)}function download(n){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([files[n].text],{type:'text/plain;charset=utf-8'}));a.download=files[n].name+'.txt';a.click();URL.revokeObjectURL(a.href)}function printFile(n){let w=window.open('','_blank');if(!w){toast('请允许打印窗口');return}w.document.write('<title>'+esc(files[n].name)+'</title><style>body{font-family:system-ui;padding:50px;line-height:1.9;white-space:pre-wrap}</style>'+esc(files[n].text));w.document.close();w.print()}
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});render();

<script>

const seedFiles=[{name:'城市漫游 · 拍摄脚本',kind:'脚本',text:script},{name:'城市漫游 · 品牌合作方案',kind:'可打印方案预览',text:'城市漫游系列 · 品牌合作方案\n\n项目目标\n以城市街区探访呈现品牌的生活方式。\n\n交付内容\n60–90 秒视频一条、配套图文一篇。\n\n内容结构\n清晨街道 → 店铺体验 → 人物交流 → 品牌场景。\n\n待确认\n预算、素材使用范围、发布时间及修改轮次。'},{name:'品牌沟通 · 会议纪要',kind:'会议纪要',text:'品牌沟通 · 会议纪要\n\n已确认：内容以真实体验为主，保留创作者表达风格。\n\n待确认：品牌提供产品与简报；创作者提交脚本；双方确认拍摄时间。\n\n下一步\n林夏：周五前提交脚本初稿。\n品牌联系人：补充预算、使用授权与发布时间。'}];files.push(...seedFiles);

function chipsFilter(values,current,fn){return '<div class="tabs">'+values.map(x=>`<button class="${current===x?'on':''}" onclick="${fn}('${x}')">${x}</button>`).join('')+'</div>'}function setTF(x){taskFilter=x;render()}function setFF(x){fileFilter=x;render()}function setIF(x){ideaFilter=x;render()}

function projectWorkspace(n,tab){let p=projectsData[n];let content='';if(tab==='概览')content=`<p class="muted">${p.desc}</p><div class="note">当前阶段：${p.stage}<br>下一步：${p.next}</div><h3 class="detailtitle">项目要求</h3><ul class="detail-list"><li>平台：抖音 / 视频号</li><li>表达：第一人称、自然叙述</li><li>内容：真实生活细节</li></ul>`;if(tab==='灵感')content=ideas.filter(i=>i.project===(n===1?'春季品牌合作':'城市漫游')).map(i=>`<div class="card"><div class="meta">${i.time} · 保留原话</div><p>${esc(i.text)}</p></div>`).join('')||'<p class="muted">尚未关联灵感。</p>';if(tab==='脚本')content=`<div class="note">当前脚本 V${version} · 演示来源：城市漫游灵感</div><p style="white-space:pre-wrap;line-height:1.9">${esc(script)}</p><button class="btn" onclick="fileDetail(0)">编辑与版本</button>`;if(tab==='文件')content=files.map((f,i)=>`<div class="item row"><span>${esc(f.name)}</span><button class="link" onclick="fileDetail(${i})">打开</button></div>`).join('');if(tab==='待办')content='<div class="item">□ 确认脚本开场与结尾 <span class="pill">林夏 · 周五</span></div><div class="item">□ 整理采访问题 <span class="pill">拍摄前</span></div><div class="item">□ 确认拍摄与授权范围 <span class="pill">待品牌回复</span></div><p class="meta">任务列表为示例；尚未接入真实日历。</p>';panel(head(p.name)+'<div class="tabs">'+['概览','灵感','脚本','文件','待办'].map(x=>`<button class="${x===tab?'on':''}" onclick="projectWorkspace(${n},'${x}')">${x}</button>`).join('')+'</div>'+content+'<div class="actionrow"><button class="btn primary" onclick="closePanel();promptFromPage(\'继续'+p.name+'\')">围绕项目继续对话</button></div>')}

<section class="agent-window" id="agentWindow"><header class="agent-header"><span class="botface"></span><div style="flex:1"><strong>Spur Agent</strong><small>创作与经营助手 · 模拟演示</small></div><button class="close" onclick="closeAgent()" aria-label="收起助手">−</button></header><div class="agent-messages" id="agentMessages"></div><div class="agent-input"><div class="agent-quick"><button onclick="agentExample('整理这周的选题')">整理选题</button><button onclick="agentExample('准备品牌合作邮件')">合作邮件</button><button onclick="agentExample('制作合作方案 PDF')">制作方案</button><button onclick="agentSettings()">主动提醒设置</button></div><textarea id="agentText" placeholder="交给我一件事，也可以接着刚才的项目…"></textarea><div class="row"><span class="meta" style="font-size:10px">使用项目上下文 · 未接入真实模型</span><button class="btn primary" onclick="sendAgent()">发送 ↑</button></div></div></section>
<script>
let agentHistory=[],agentRuns=new Map(),agentSeq=0,agentProactive=true;
function openAgent(){$('#agentWindow').style.display='flex';$('#agentLaunch').style.display='none';$('#agentNudge').style.display='none';$('#agentDot').style.display='none';if(!agentHistory.length){agentHistory.push({html:'我看到了「城市漫游」里的开场、采访问题和结尾想法。可以整理成一份可继续修改的脚本提纲。<div class="card"><h3>主动建议 · 素材已可成稿</h3><p class="meta">依据：3 条关联灵感；这里的判断为预设演示。</p><button class="btn primary" onclick="agentAction(\'整理城市漫游的脚本提纲\')">整理提纲</button> <button class="link" onclick="agentLater()">稍后</button></div><div class="card"><h3>合作跟进 · 等待你确认</h3><p>品牌合作回复还未定稿，可以先准备邮件供你审阅。</p><button class="link" onclick="agentAction(\'准备品牌合作邮件\')">准备回复 →</button></div>'})}renderAgent();$('#agentText').focus()}
function closeAgent(){$('#agentWindow').style.display='none';$('#agentLaunch').style.display='grid'}
function renderAgent(){let box=$('#agentMessages');box.innerHTML=agentHistory.map(m=>`<div class="agent-msg ${m.mine?'mine':''}">${m.html}</div>`).join('');box.scrollTop=box.scrollHeight}
function agentLater(){agentHistory.push({html:'好的，这条建议暂时搁置。你可以随时回来继续。'});renderAgent()}
function agentExample(t){$('#agentText').value=t;$('#agentText').focus()}
function sendAgent(){let text=$('#agentText').value.trim();if(!text)return;$('#agentText').value='';agentAction(text)}
function agentAction(text){let id=++agentSeq;let type=/邮件|回复|合作跟进/.test(text)?'mail':/PDF|pdf|方案/.test(text)?'pdf':'script';let task={name:text,status:'running',steps:['已收到委派（模拟）'],type};tasks.push(task);let ti=tasks.length-1;agentRuns.set(id,{task,ti});agentHistory.push({mine:true,html:esc(text)});agentHistory.push({html:`<div class="card"><h3>${esc(text)}</h3><div class="agent-status" id="agentState${id}">正在整理相关项目资料（模拟）…</div><button class="link" onclick="taskDetail(${ti})">查看任务过程</button> <button class="link" onclick="cancelAgentRun(${id})">取消</button></div>`});renderAgent();setTimeout(()=>{if(task.status!=='running')return;task.steps.push('已读取关联灵感与项目要求（模拟）');let el=$('#agentState'+id);if(el)el.textContent='正在准备草稿（模拟）…'},900);setTimeout(()=>{if(task.status!=='running')return;let f={name:type==='mail'?'品牌合作回复 · 待确认':type==='pdf'?'合作方案 · 预览稿':'城市漫游 · 脚本提纲',kind:type==='mail'?'邮件草稿':type==='pdf'?'可打印方案预览':'脚本',text:type==='mail'?'收件人：brand@example.com（演示）\n主题：城市漫游系列合作沟通\n\n您好，感谢此次合作邀请。\n\n我们计划以城市生活观察为主线，在真实探访中自然呈现产品。请补充本次预算、发布档期、素材授权范围及交付要求，我会据此完善方案。\n\n期待进一步沟通。':type==='pdf'?'城市漫游 · 合作方案\n\n一、内容方向\n从清晨街道走进一家小店，以真实交流讲述城市生活。\n\n二、交付内容\n60–90 秒视频一条及配套图文。\n\n三、合作待确认\n预算、档期、素材授权及修改轮次。\n\n此为演示草稿，打印功能可存为 PDF。':'城市漫游 · 脚本提纲\n\n01 开场\n清晨街道，小店开门。\n来源：城市漫游的开场。\n\n02 采访\n问店主：这条街最让你舍不得的是什么？\n来源：采访问题灵感。\n\n03 结尾\n熟悉一条街，就是知道什么时候有人给你留一盏灯。\n来源：店主的话。\n\n待补充：具体拍摄地点、采访授权和镜头安排。'};files.push(f);task.file=files.length-1;task.status=type==='mail'?'confirm':'done';task.steps.push('草稿完成，等待审阅' +(type==='mail'?'与发送确认':'')+'（模拟）');let old=$('#agentState'+id);if(old)old.textContent=type==='mail'?'草稿完成 · 等待确认':'已完成';agentHistory.push({html:`${type==='mail'?'邮件草稿已准备好。请先审阅收件人和正文，尚未发送。':'草稿准备好了，相关任务和文件已同步到侧边页面。'}<div class="card"><h3>${esc(f.name)}</h3><span class="meta">${f.kind} · 演示成果</span><div class="actionrow"><button class="btn" onclick="fileDetail(${task.file})">打开草稿</button>${type==='mail'?`<button class="btn primary" onclick="reviewAgentMail(${id})">审阅并确认</button>`:`<button class="link" onclick="agentExample('继续修改刚才的草稿：')">继续修改 →</button>`}</div></div>`});if($('#agentWindow').style.display!=='none')renderAgent();else if(agentProactive){$('#agentNudge').innerHTML='<strong>任务有新进展</strong>'+esc(f.name)+'已准备好，点开查看。';$('#agentNudge').style.display='block';$('#agentDot').style.display='block'}if(page==='tasks'||page==='files')render()},2400)}
function cancelAgentRun(id){let run=agentRuns.get(id);if(!run||run.task.status!=='running'){toast('任务已结束');return}run.task.status='cancelled';run.task.steps.push('用户取消了本次演示');agentHistory.push({html:'这项任务已取消。原灵感和已有文件没有删除。'});renderAgent();if(page==='tasks')render()}
function reviewAgentMail(id){let run=agentRuns.get(id);if(!run)return;let f=files[run.task.file];panel(head('确认邮件内容')+'<span class="badge">模拟发送 · 未连接邮箱</span><p style="white-space:pre-wrap;line-height:1.9">'+esc(f.text)+'</p><button class="btn primary" onclick="confirmAgentMail('+id+')">确认模拟发送</button>');}
function confirmAgentMail(id){let r=agentRuns.get(id);if(r.task.status==='done'){toast('已模拟发送，请勿重复操作');return}r.task.status='done';r.task.steps.push('用户确认模拟发送，未产生真实邮件');closePanel();agentHistory.push({html:'模拟发送已完成。正式接入邮箱后，也会在你确认具体内容后再执行。'});renderAgent();if(page==='tasks')render()}
function agentSettings(){panel(head('主动提醒')+'<p class="muted">只在有明确下一步时提醒，不反复催促。</p><div class="item">素材已可成稿：预设演示建议</div><div class="item">任务完成、合作待确认：状态更新</div><div class="item row"><span>允许浮动提示</span><button class="btn" onclick="agentProactive=!agentProactive;this.textContent=agentProactive?\'已开启\':\'已关闭\';if(!agentProactive)$(\'#agentNudge\').style.display=\'none\'">'+(agentProactive?'已开启':'已关闭')+'</button></div><p class="meta">关闭后仍可手动打开助手。所有主动行为仅为本页模拟。</p>')}
$('#agentText').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAgent()}});
</script>
<style>
.agent-launch{touch-action:none;cursor:grab;user-select:none;animation:agentBob 4s ease-in-out infinite}.agent-launch.dragging{animation:none;cursor:grabbing;transition:none}.agent-launch .botface{pointer-events:none}.agent-launch .antenna{pointer-events:none}.agent-launch .agentdot{display:none!important}@keyframes agentBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.agent-nudge,.agent-quick{display:none!important}.agent-window{height:min(720px,88dvh)}.agent-messages:empty{background:white}.agent-input{padding:16px}.agent-input textarea{height:60px}.agent-header small{display:none}.agent-header .expand{border:0;background:none;color:#8193a5;padding:8px;font-size:17px}.agent-window.expanded{width:min(900px,calc(100vw - 48px));height:calc(100dvh - 48px)}.agent-msg .refs{font-size:11px;color:#8b9daf;margin-top:10px}.agent-msg .refs button{background:none;border:0;color:#6f8ba7;font-size:11px;padding:3px}.agent-msg p{white-space:pre-wrap}.agent-window .agent-input .meta{display:none}@media(max-width:700px){.agent-window.expanded{width:auto;height:calc(100dvh - 24px)}}
</style><script>
agentHistory=[];agentProactive=false;$('#agentNudge').remove();$('#agentDot').style.display='none';$('#agentMessages').innerHTML='';document.querySelector('.agent-quick').remove();document.querySelector('.agent-header strong').textContent='Spur';$('#agentText').placeholder='说说你的想法…';document.querySelector('.agent-header').insertAdjacentHTML('beforeend','<button class="expand" onclick="$(\'#agentWindow\').classList.toggle(\'expanded\')" aria-label="展开对话">⤢</button>');
openAgent=function(){$('#agentWindow').style.display='flex';$('#agentLaunch').style.display='none';renderAgent();$('#agentText').focus()};closeAgent=function(){$('#agentWindow').style.display='none';$('#agentLaunch').style.display='grid'};
const orb=$('#agentLaunch');let drag=null,suppressClick=false;
orb.addEventListener('pointerdown',e=>{if(e.button!==0)return;let r=orb.getBoundingClientRect();drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:r.left,top:r.top,moved:false};orb.setPointerCapture(e.pointerId)});
orb.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(!drag.moved)return;orb.classList.add('dragging');orb.style.right='auto';orb.style.bottom='auto';orb.style.left=Math.max(8,Math.min(innerWidth-orb.offsetWidth-8,drag.left+dx))+'px';orb.style.top=Math.max(8,Math.min(innerHeight-orb.offsetHeight-8,drag.top+dy))+'px'});
function finishDrag(){if(!drag)return;suppressClick=drag.moved;drag=null;orb.classList.remove('dragging');if(suppressClick)setTimeout(()=>suppressClick=false,300)}orb.addEventListener('pointerup',finishDrag);orb.addEventListener('pointercancel',finishDrag);orb.onclick=()=>{if(!suppressClick)openAgent()};window.addEventListener('resize',()=>{if(orb.style.left){orb.style.left=Math.max(8,Math.min(innerWidth-orb.offsetWidth-8,parseFloat(orb.style.left)))+'px';orb.style.top=Math.max(8,Math.min(innerHeight-orb.offsetHeight-8,parseFloat(orb.style.top)))+'px'}});
function matchedRecords(text){let words=text.toLowerCase().match(/[a-z]+|[\u4e00-\u9fff]{2}/g)||[];let ranked=flowRecords.map((r,n)=>({r,n,score:words.reduce((a,w)=>a+(r.title+r.text+r.project).toLowerCase().includes(w),0)})).sort((a,b)=>b.score-a.score);return ranked.filter(x=>x.score>0).slice(0,3)}
agentAction=function(text){agentHistory.push({mine:true,html:esc(text)});const refs=matchedRecords(text);const id=++agentSeq;agentHistory.push({html:`<span id="cleanWait${id}" style="color:#a2adba">···</span>`});renderAgent();setTimeout(()=>{let response;if(/合作|品牌|邮件|报价/.test(text)){let relevant=refs.length?refs:flowRecords.map((r,n)=>({r,n})).filter(x=>/合作/.test(x.r.project)).slice(0,2);response='你的合作记录里，有两件事需要先确认：素材授权范围，以及脚本提交时间。\n\n可以把内容制作、素材授权和额外修改分开说明，先问清品牌的预算与使用范围，再完善报价。';response+='<div class="refs">'+relevant.map(x=>`<button onclick="flowDetail(${x.n})">↗ ${esc(x.r.title)}</button>`).join(' · ')+'</div>'}else if(/脚本|提纲|漫游|整理|选题/.test(text)){const selected=refs.length?refs:flowRecords.map((r,n)=>({r,n})).filter(x=>x.r.project==='城市漫游').slice(0,3);response='结合你留下的记录，这期内容可以围绕「重新认识一座熟悉的城市」展开：\n\n开场：清晨的小店开门，从街道的一个细节进入。\n中段：跟店主聊聊，他为什么一直留在这里。\n结尾：用「有人给你留一盏灯」收住情绪。\n\n这三个片段已经有连贯的方向，可以在这个基础上继续改。';response+='<div class="refs">'+selected.map(x=>`<button onclick="flowDetail(${x.n})">↗ ${esc(x.r.title)}</button>`).join(' · ')+'</div>'}else if(refs.length){response='我找到与你这句话相关的记录：\n\n'+refs.map(x=>x.r.text).join('\n\n')+'<div class="refs">'+refs.map(x=>`<button onclick="flowDetail(${x.n})">↗ ${esc(x.r.title)}</button>`).join(' · ')+'</div>'}else{response='当前原型还没有接入真实模型，暂时无法根据这句话完成分析。你的输入会保留在这段对话里。'}agentHistory[agentHistory.findIndex(x=>x.html.includes('id="cleanWait'+id+'"'))]={html:'<p>'+response.replace(/\n/g,'<br>')+'</p>'};renderAgent()},950)};
</script>
